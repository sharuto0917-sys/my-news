```html

    * {
      box-sizing: border-box;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

<body>

<header>
  <div class="header-inner">
    <h1>📰 MY NEWS</h1>
    <p>自分専用ニュースダッシュボード</p>
  </div>
</header>

<nav>
  <div class="nav-inner">
    <a href="#日本">🇯🇵 日本</a>
    <a href="#国際">🌏 国際</a>
    <a href="#AI・IT">💻 AI・IT</a>
    <a href="#教育">📚 教育</a>
    <a href="#音楽">🎸 音楽</a>
  </div>
</nav>

<main>

  <div class="page-title">
    <h2>今日のニュース</h2>
    <p>気になるニュースを検索・お気に入り登録できます</p>
  </div>

  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="🔎 ニュースを検索..."
    >
  </div>

  <div id="news-container">
    <p>ニュースを読み込んでいます...</p>
  </div>

</main>

<footer>
  MY NEWS
</footer>

<script>
let allNews = {};
let favorites = JSON.parse(localStorage.getItem("myNewsFavorites") || "[]");

const icons = {
  "日本": "🇯🇵",
  "国際": "🌏",
  "AI・IT": "💻",
  "教育": "📚",
  "音楽": "🎸"
};

async function loadNews() {
  try {
    const response = await fetch("news.json");

    if (!response.ok) {
      throw new Error("news.jsonを取得できませんでした");
    }

    allNews = await response.json();

    displayNews();

  } catch (error) {
    console.error(error);

    document.getElementById("news-container").innerHTML =
      '<p class="error">ニュースを読み込めませんでした。</p>';
  }
}

function displayNews() {

  const container = document.getElementById("news-container");
  const searchWord = document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();

  container.innerHTML = "";

  for (const [category, articles] of Object.entries(allNews)) {

    const filteredArticles = articles.filter(article =>
      article.title.toLowerCase().includes(searchWord)
    );

    const section = document.createElement("section");
    section.className = "category";
    section.id = category;

    const heading = document.createElement("h2");
    heading.textContent =
      `${icons[category] || "📰"} ${category}`;

    section.appendChild(heading);

    if (filteredArticles.length === 0) {

      const message = document.createElement("p");
      message.className = "no-result";
      message.textContent =
        searchWord ? "検索結果がありません。" : "ニュースがありません。";

      section.appendChild(message);

    } else {

      filteredArticles.forEach((article, index) => {

        const div = document.createElement("div");
        div.className = "news";

        const number = document.createElement("span");
        number.className = "news-number";
        number.textContent = `${index + 1}.`;

        const content = document.createElement("div");
        content.className = "news-content";

        const link = document.createElement("a");
        link.href = article.url;
        link.textContent = article.title;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        content.appendChild(link);

        const favoriteButton = document.createElement("button");
        favoriteButton.className = "favorite";

        const isFavorite = favorites.some(
          item => item.url === article.url
        );

        favoriteButton.textContent =
          isFavorite ? "⭐" : "☆";

        favoriteButton.title =
          isFavorite ? "お気に入りから削除" : "お気に入りに追加";

        favoriteButton.onclick = () => {
          toggleFavorite(article);
        };

        div.appendChild(number);
        div.appendChild(content);
        div.appendChild(favoriteButton);

        section.appendChild(div);
      });
    }

    container.appendChild(section);
  }
}

function toggleFavorite(article) {

  const index = favorites.findIndex(
    item => item.url === article.url
  );

  if (index >= 0) {
    favorites.splice(index, 1);
  } else {
    favorites.push(article);
  }

  localStorage.setItem(
    "myNewsFavorites",
    JSON.stringify(favorites)
  );

  displayNews();
}

document.getElementById("search").addEventListener(
  "input",
  displayNews
);

loadNews();
</script>

</body>
</html>
