<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY NEWS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f1f3f6;
      color: #1f2937;
    }

    /* ヘッダー */
    header {
      background: #111827;
      color: white;
      padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    header p {
      margin: 6px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    /* ナビゲーション */
    nav {
      background: white;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      overflow-x: auto;
    }

    nav a {
      padding: 14px 18px;
      color: #374151;
      text-decoration: none;
      white-space: nowrap;
      font-weight: bold;
      font-size: 14px;
    }

    nav a:hover {
      background: #f3f4f6;
    }

    /* メイン */
    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 24px;
    }

    .page-title p {
      margin: 6px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    /* カテゴリー */
    .category {
      background: white;
      margin-bottom: 28px;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .category h2 {
      margin: 0 0 15px;
      padding-bottom: 12px;
      border-bottom: 3px solid #111827;
      font-size: 21px;
    }

    /* ニュース */
    .news {
      padding: 16px 4px;
      border-bottom: 1px solid #e5e7eb;
      transition: background 0.2s;
    }

    .news:last-child {
      border-bottom: none;
    }

    .news:hover {
      background: #f8fafc;
    }

    .news a {
      color: #1d4ed8;
      font-weight: 600;
      text-decoration: none;
      line-height: 1.6;
      font-size: 16px;
    }

    .news a:hover {
      text-decoration: underline;
    }

    .news-number {
      display: inline-block;
      width: 28px;
      color: #9ca3af;
      font-weight: bold;
    }

    /* エラー */
    .error {
      color: #dc2626;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    /* フッター */
    footer {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      padding: 30px 15px;
    }

    /* スマホ */
    @media (max-width: 600px) {
      header h1 {
        font-size: 26px;
      }

      main {
        margin-top: 20px;
      }

      .category {
        padding: 18px;
      }

      .news a {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>📰 MY NEWS</h1>
    <p>自分専用ニュースダッシュボード</p>
  </div>
</header>

<nav>
  <div class="nav-inner">
    <a href="#日本">🇯🇵 日本</a>
    <a href="#国際">🌏 国際</a>
    <a href="#AI・IT">💻 AI・IT</a>
    <a href="#教育">📚 教育</a>
    <a href="#音楽">🎸 音楽</a>
  </div>
</nav>

<main>

  <div class="page-title">
    <h2>今日のニュース</h2>
    <p>最新のニュースをカテゴリ別にチェック</p>
  </div>

  <div id="news-container">
    <p>ニュースを読み込んでいます...</p>
  </div>

</main>

<footer>
  MY NEWS
</footer>

<script>
async function loadNews() {
  try {
    const response = await fetch("news.json");

    if (!response.ok) {
      throw new Error("news.jsonを取得できませんでした");
    }

    const news = await response.json();
    const container = document.getElementById("news-container");

    const icons = {
      "日本": "🇯🇵",
      "国際": "🌏",
      "AI・IT": "💻",
      "教育": "📚",
      "音楽": "🎸"
    };

    container.innerHTML = "";

    for (const [category, articles] of Object.entries(news)) {

      const section = document.createElement("section");
      section.className = "category";
      section.id = category;

      const heading = document.createElement("h2");
      heading.textContent = `${icons[category] || "📰"} ${category}`;
      section.appendChild(heading);

      if (articles.length === 0) {

        const message = document.createElement("p");
        message.textContent = "ニュースがありません。";
        section.appendChild(message);

      } else {

        articles.forEach((article, index) => {

          const div = document.createElement("div");
          div.className = "news";

          const number = document.createElement("span");
          number.className = "news-number";
          number.textContent = `${index + 1}.`;

          const link = document.createElement("a");
          link.href = article.url;
          link.textContent = article.title;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          div.appendChild(number);
          div.appendChild(link);

          section.appendChild(div);
        });
      }

      container.appendChild(section);
    }

  } catch (error) {

    console.error(error);

    document.getElementById("news-container").innerHTML =
      '<p class="error">ニュースを読み込めませんでした。</p>';
  }
}

loadNews();
</script>

</body>
</html>
